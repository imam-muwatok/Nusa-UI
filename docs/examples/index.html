<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examples - Nusa UI</title>
    <link rel="stylesheet" href="../../assets/css/nusa.css">
    <style>
        body {
            padding: 2rem 0;
            background-color: var(--nusa-body-bg, #f8f9fa);
            color: var(--nusa-body-color, #212529);
        }
        [data-nusa-theme="dark"] body {
            --nusa-body-bg: #121212;
            --nusa-body-color: #e0e0e0;
        }
        .example-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .example-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 1rem 3rem rgba(0,0,0,.175) !important;
        }
    </style>
</head>
<body>
    <div class="nusa-container">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold mb-3">Examples</h1>
            <p class="lead text-secondary">Kumpulan contoh implementasi komponen Nusa UI.</p>
        </div>

        <div class="nusa-row" id="examples-list">
            <!-- Item akan di-generate oleh JavaScript -->
        </div>
    </div>

    <script>
        // Konfigurasi Folder Examples
        // Tambahkan folder baru ke dalam array ini
        const examples = [
            {
                folder: 'portfolio',
                title: 'Portfolio',
                description: 'Contoh landing page personal branding lengkap dengan hero, about, dan contact.',
                image: 'https://placehold.co/600x400/4745D5/FFFFFF?text=Portfolio' 
            },
            {
                folder: 'blog',
                title: 'Blog',
                description: 'Layout blog klasik dengan featured post, grid artikel, dan sidebar.',
                image: 'https://placehold.co/600x400/E95897/FFFFFF?text=Blog'
            }
        ];

        const container = document.getElementById('examples-list');

        examples.forEach(ex => {
            const col = document.createElement('div');
            col.className = 'nusa-col-md-6 nusa-col-lg-4 mb-4';
            
            col.innerHTML = `
                <div class="nusa-card h-100 shadow-sm border-0 example-card">
                    <div class="ratio ratio-4x3 overflow-hidden rounded-top">
                        <img src="${ex.image}" class="nusa-card-img-top object-fit-cover" alt="${ex.title}">
                    </div>
                    <div class="nusa-card-body d-flex flex-column">
                        <h3 class="h5 nusa-card-title fw-bold">${ex.title}</h3>
                        <p class="nusa-card-text text-secondary small flex-grow-1">${ex.description}</p>
                        <a href="${ex.folder}/index.html" class="nusa-btn nusa-btn-primary nusa-btn-sm stretched-link">
                            Lihat Demo
                        </a>
                    </div>
                </div>
            `;
            
            container.appendChild(col);
        });

        // Dark Mode Sync
        (function() {
            try {
                const savedTheme = localStorage.getItem('nusa-theme');
                const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
                    document.documentElement.setAttribute('data-nusa-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>
