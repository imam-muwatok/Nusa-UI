<!DOCTYPE html>
<html lang="id" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Footer Example - Nusa UI</title>
    <link rel="stylesheet" href="../../assets/css/nusa.css">
    <link rel="stylesheet" href="../../assets/css/docs.css">
    <script>
        // Sinkronisasi tema
        (function() {
            try {
                const savedTheme = localStorage.getItem('nusa-theme');
                const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
                    document.documentElement.setAttribute('data-nusa-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-nusa-theme', 'light');
                }
            } catch (e) { console.warn('Nusa UI: LocalStorage access denied'); }
        })();
    </script>
    <style>
        /* Styles from sass/extras/_sticky-footer.scss */
        main > .nusa-container {
            padding: 60px 15px 0;
        }
        .footer {
            background-color: #f8f9fa;
        }
        .footer > .nusa-container {
            padding-right: 15px;
            padding-left: 15px;
        }
        [data-nusa-theme="dark"] .footer {
            background-color: #1e1e1e;
        }
        .mt-auto {
            margin-top: auto !important;
        }
        
        /* Custom code style for this example */
        code {
            font-size: 80%;
            color: var(--nusa-secondary, #E95897);
        }
    </style>
</head>
<body class="d-flex flex-column h-100">
    
    <!-- Begin page content -->
    <main class="flex-shrink-0">
        <div class="nusa-container">
            <h1 class="mt-5">Sticky footer</h1>
            <p class="lead">Sematkan footer ke bagian bawah viewport saat konten halaman pendek.</p>
            <p>Gunakan kelas utilitas <code>.d-flex .flex-column .h-100</code> pada <code>body</code> dan <code>.mt-auto</code> pada footer untuk mendorongnya ke bawah.</p>
            <p>Kembali ke <a href="../index.html">dokumentasi</a> atau lihat <a href="sticky-footer-navbar.html">contoh dengan navbar tetap</a>.</p>
        </div>
    </main>

    <footer class="footer mt-auto py-3">
        <div class="nusa-container">
            <span class="text-secondary">Place sticky footer content here.</span>
        </div>
    </footer>

    <script type="module" src="../../assets/js/nusa-script.js"></script>
</body>
</html>
