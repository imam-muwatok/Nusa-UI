<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Navbar Example - Nusa UI</title>
    <link rel="stylesheet" href="../../assets/css/nusa.css">
    <link rel="stylesheet" href="../../assets/css/docs.css">
    <script>
        // Sinkronisasi tema
        (function() {
            try {
                const savedTheme = localStorage.getItem('nusa-theme');
                const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
                    document.documentElement.setAttribute('data-nusa-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-nusa-theme', 'light');
                }
            } catch (e) { console.warn('Nusa UI: LocalStorage access denied'); }
        })();
    </script>
    <style>
        /* Menambahkan tinggi agar halaman bisa discroll untuk mendemonstrasikan perilaku statis */
        body {
            min-height: 75rem;
        }
    </style>
</head>
<body>
    
    <nav class="nusa-navbar nusa-navbar-expand-md bg-dark text-white mb-4">
        <div class="nusa-container-fluid">
            <a class="nusa-navbar-brand text-white" href="#">Static Navbar</a>
            <button class="nusa-navbar-toggler border-secondary" type="button" data-nusa-toggle="collapse" data-nusa-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <span class="nusa-navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="nusa-collapse nusa-navbar-collapse" id="navbarCollapse">
                <ul class="nusa-navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nusa-nav-item">
                        <a class="nusa-nav-link active text-white" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nusa-nav-item">
                        <a class="nusa-nav-link text-secondary" href="#">Link</a>
                    </li>
                    <li class="nusa-nav-item">
                        <a class="nusa-nav-link disabled text-secondary opacity-50" aria-disabled="true">Disabled</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="nusa-form-control me-2 bg-dark text-white border-secondary" type="search" placeholder="Search" aria-label="Search">
                    <button class="nusa-btn nusa-btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="nusa-container">
        <div class="bg-light p-5 rounded">
            <h1 class="display-4 fw-bold">Static Navbar</h1>
            <p class="lead">Contoh ini adalah demonstrasi cepat dari navigasi bar statis. Navbar ini akan ikut bergulir (scroll) bersama dengan konten halaman lainnya, tidak menempel di atas.</p>
            <a class="nusa-btn nusa-btn-lg nusa-btn-primary" href="../index.html" role="button">Kembali ke Dokumentasi &raquo;</a>
        </div>
    </main>

    <script type="module" src="../../assets/js/nusa-script.js"></script>
</body>
</html>
