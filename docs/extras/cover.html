<!DOCTYPE html>
<html lang="id" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Template - Nusa UI</title>
    <link rel="stylesheet" href="../../assets/css/nusa.css">
    <link rel="stylesheet" href="../../assets/css/docs.css">
    <script>
        // Sinkronisasi tema
        (function() {
            try {
                const savedTheme = localStorage.getItem('nusa-theme');
                const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
                    document.documentElement.setAttribute('data-nusa-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-nusa-theme', 'light');
                }
            } catch (e) { console.warn('Nusa UI: LocalStorage access denied'); }
        })();
    </script>
    <style>
      /* Styles from sass/extras/_cover.scss */
      .cover-container {
        max-width: 42em;
      }

      .nav-masthead .nusa-nav-link {
        color: rgba(255, 255, 255, .5);
        border-bottom: .25rem solid transparent;
        padding: .25rem 0;
        font-weight: 700;
        background-color: transparent;
        border-radius: 0;
      }

      .nav-masthead .nusa-nav-link:hover,
      .nav-masthead .nusa-nav-link:focus {
        border-bottom-color: rgba(255, 255, 255, .25);
        color: rgba(255, 255, 255, .75);
      }

      .nav-masthead .nusa-nav-link + .nusa-nav-link {
        margin-left: 1rem;
      }

      .nav-masthead .active {
        color: #fff;
        border-bottom-color: #fff;
      }
      
      /* Specific override for this template to ensure full height */
      body {
          display: flex;
          height: 100%;
          text-shadow: 0 .05rem .1rem rgba(0, 0, 0, .5);
          box-shadow: inset 0 0 5rem rgba(0, 0, 0, .5);
      }
      
      /* Light mode overrides */
      [data-nusa-theme="light"] body {
          color: #333 !important;
          text-shadow: none;
          box-shadow: none;
          background-color: #f5f5f5 !important;
      }
      [data-nusa-theme="light"] .nav-masthead .nusa-nav-link {
          color: rgba(0,0,0,.5);
      }
      [data-nusa-theme="light"] .nav-masthead .active {
          color: #000;
          border-bottom-color: #000;
      }
    </style>
</head>
<body class="d-flex h-100 text-center text-white bg-dark">
    
    <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
      <header class="mb-auto">
        <div>
          <h3 class="float-md-start mb-0">Cover</h3>
          <nav class="nusa-nav nav-masthead justify-content-center float-md-end">
            <a class="nusa-nav-link active" aria-current="page" href="#">Home</a>
            <a class="nusa-nav-link" href="#">Features</a>
            <a class="nusa-nav-link" href="#">Contact</a>
          </nav>
        </div>
      </header>

      <main class="px-3">
        <h1 class="display-1">Cover your page.</h1>
        <p class="lead">Cover is a one-page template for building simple and beautiful home pages. Download, edit the text, and add your own fullscreen background photo to make it your own.</p>
        <p class="lead">
          <a href="#" class="nusa-btn nusa-btn-lg nusa-btn-light fw-bold border-white bg-white text-dark">Learn more</a>
        </p>
      </main>

      <footer class="mt-auto text-white-50">
        <p>Cover template for <a href="../../index.html" class="text-white">Nusa UI</a>.</p>
      </footer>
    </div>

    <script type="module" src="../../assets/js/nusa-script.js"></script>
</body>
</html>
