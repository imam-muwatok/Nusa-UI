<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Installation - Nusa UI</title>
    <link rel="stylesheet" href="../assets/css/nusa.css">
    <script>
        // Sinkronisasi tema
        (function() {
            try {
                const savedTheme = localStorage.getItem('nusa-theme');
                const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
                    document.documentElement.setAttribute('data-nusa-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-nusa-theme', 'light');
                }
            } catch (e) {
                console.warn('Nusa UI: LocalStorage access denied in iframe head script');
            }
        })();
    </script>
    <style>
        body {
            padding: 1rem;
            background-color: transparent;
        }
    </style>
</head>
<body>
    <section id="installation">
        <h2>Instalasi</h2>
        <p>Clone repositori atau unduh file rilis terbaru.</p>
        <div class="nusa-card bg-dark text-white border-0">
            <div class="nusa-card-body">
                <code>git clone https://github.com/imam-muwatok/nusa-ui.git</code>
            </div>
        </div>
    </section>
</body>
</html>
